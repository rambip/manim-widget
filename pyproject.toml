[project]
name = "manim-widget"
version = "0.2.0rc2"
description = "Manim Widget: manim, truly interactive, without the hassle"
readme = "README.md"
authors = [
    { name = "Antonin P", email = "antonin.peronnet@telecom-paris.fr" }
]
requires-python = ">=3.11"
dependencies = [
    "anywidget>=0.9.21",
    "manim>=0.20.1",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.rope]
ignored_resources = [
    "*.pyc",
    "*~",
    ".ropeproject",
    ".hg",
    ".svn",
    "_svn",
    ".git",
    ".tox",
    ".venv",
    "venv",
    ".mypy_cache",
    ".pytest_cache",
    "manim-web",
    "node_modules",
    "__marimo__",
    "media",
    "examples",
]

[dependency-groups]
dev = [
    "hypothesis>=6.155.2",
    "jsonschema>=4.26.0",
    "marimo>=0.21.1",
    "playwright>=1.58.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
    "pytest-playwright>=0.7.2",
    "rope>=1.14.0",
    "ruff>=0.15.8",
]
