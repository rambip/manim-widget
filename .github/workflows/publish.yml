name: Publish Python distribution to PyPI

on: push

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build project
        run: uv build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v5
        with:
          name: package-wheel
          path: dist/
  pypi-publish:
    name: Upload release to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/manim-widget
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      # Tags can be pushed from any branch; only publish ones that are
      # actually reachable from main, so a tag pushed from a feature branch
      # can't slip a pre-merge build onto PyPI.
      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} is not reachable from main; refusing to publish." >&2
            exit 1
          fi

      # js/build-remote.ts bakes the manim-web submodule's version into the
      # CDN URL for this release's js="remote" mode. If that version was
      # never published to npm, the remote bundle 404s in the browser.
      - name: Verify manim-web CDN version is published
        run: python3 scripts/check_manim_web_published.py

      - uses: actions/download-artifact@v6
        with:
          name: package-wheel
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
