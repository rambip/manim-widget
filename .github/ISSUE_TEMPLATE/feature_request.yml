name: Feature request
description: Suggest a new animation, mobject, or capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: <!-- Thanks for your interest in this project! 🎉 -->

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: > 
        Describe the use case or the gap you're running into.
        Include how it could work, and python usage if you can.
    validations:
      required: true

  - type: dropdown
    id: willing
    attributes:
      label: Are you willing to open a PR?
      options:
        - "Yes"
        - "Maybe"
        - "No"

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
